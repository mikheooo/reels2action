version: '3.8'

services:
  bot:
    build: .
    command: python -m bot.main
    restart: unless-stopped
    env_file: .env
    environment:
      - EXPECTED_BOT_USERNAME=Reels2ActionBot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: arq worker.main.WorkerSettings
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      cobalt-api:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-reels_user}
      POSTGRES_PASSWORD: ${DB_PASS:-reels_pass}
      POSTGRES_DB: ${DB_NAME:-reels_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reels_user} -d ${DB_NAME:-reels_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data

  cobalt-api:
    image: ghcr.io/imputnet/cobalt:11
    restart: always
    init: true
    environment:
      - API_PORT=9000
      - API_URL=http://cobalt-api:9000

volumes:
  pgdata:
  redisdata:
